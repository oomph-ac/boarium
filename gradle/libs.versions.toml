[versions]
# Keep in step with the protocol version Boar master compiles against (Boar's gradle/libs.versions.toml).
protocol = "3.0.0.Beta15-20261027.163553-3"
# Cloudburst's RakNet and NetherNet transports, pinned to a published snapshot.
network = "2.0.0.CR6-20261103.124955-24"
# The WebRTC library NetherNet runs on, at the build the NetherNet transport asks for.
libdatachannel = "0.24.6.0-20261029.091642-10"
# Same Snappy library the protocol library pulls in.
aircompressor = "2.0.3"
# The Boar anticheat's master branch, at its latest published snapshot.
boar = "master-SNAPSHOT"
# Boar compiles against these without bringing them, so they are Boar's versions; the NetherNet transport raises gson to 2.13.2 at runtime.
guava = "33.6.0-jre"
gson = "2.3.1"
# Boar reads its config with this, so it is Boar's version; the protocol library's Jackson BOM raises it to 2.18.0 at runtime.
jackson = "2.15.2"
junit = "5.13.4"
snakeyaml = "2.3"
# Same NBT library the protocol library pulls in.
nbt = "3.1.0.Final"
# libdatachannel logs through the slf4j 2 API.
slf4j = "2.0.20"

[libraries]
protocol = { module = "org.cloudburstmc.protocol:bedrock-connection", version.ref = "protocol" }
protocol-codec = { module = "org.cloudburstmc.protocol:bedrock-codec", version.ref = "protocol" }
protocol-common = { module = "org.cloudburstmc.protocol:common", version.ref = "protocol" }
raknet = { module = "org.cloudburstmc.netty:netty-transport-raknet", version.ref = "network" }
nethernet = { module = "org.cloudburstmc.netty:netty-transport-nethernet", version.ref = "network" }
network-common = { module = "org.cloudburstmc.netty:netty-transport-common", version.ref = "network" }
libdatachannel = { module = "dev.opencollab:libdatachannel-java", version.ref = "libdatachannel" }
libdatachannel-natives = { module = "dev.opencollab:libdatachannel-java-arch-detect", version.ref = "libdatachannel" }
boar = { module = "ac.boar:common", version.ref = "boar" }
boar-api = { module = "ac.boar:api", version.ref = "boar" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
nbt = { module = "org.cloudburstmc:nbt", version.ref = "nbt" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
aircompressor = { module = "io.airlift:aircompressor", version.ref = "aircompressor" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
