[versions]
# Keep in step with the protocol version Boar dev2 compiles against (Boar's gradle/libs.versions.toml).
protocol = "3.0.0.Beta13-20260921.100211-29"
# Same Snappy library the protocol library pulls in.
aircompressor = "0.27"
junit = "5.13.4"

[libraries]
protocol = { module = "org.cloudburstmc.protocol:bedrock-connection", version.ref = "protocol" }
aircompressor = { module = "io.airlift:aircompressor", version.ref = "aircompressor" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
