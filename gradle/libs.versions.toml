[versions]
# Keep in step with the protocol version Boar dev2 compiles against (Boar's gradle/libs.versions.toml).
protocol = "3.0.0.Beta13-20260921.100211-29"
# Same Snappy library the protocol library pulls in.
aircompressor = "0.27"
junit = "5.13.4"
snakeyaml = "2.3"
# The slf4j API the protocol library pulls in is 1.7.
slf4j = "1.7.36"

[libraries]
protocol = { module = "org.cloudburstmc.protocol:bedrock-connection", version.ref = "protocol" }
aircompressor = { module = "io.airlift:aircompressor", version.ref = "aircompressor" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
