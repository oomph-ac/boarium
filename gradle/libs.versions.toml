[versions]
# Keep in step with the protocol version Boar dev2 compiles against (Boar's gradle/libs.versions.toml).
protocol = "3.0.0.Beta13-20260921.100211-29"
# Same Snappy library the protocol library pulls in.
aircompressor = "0.27"
# The Boar anticheat's dev2 branch, pinned to a published snapshot (commit 8bebb55), with its api module at the same snapshot.
boar = "dev2-20261102.194624-51"
# Boar compiles against these without bringing them, so they are Boar's versions.
guava = "33.6.0-jre"
gson = "2.3.1"
# Boar reads its config with this, so it is Boar's version; the protocol library's Jackson BOM raises it to 2.18.0 at runtime.
jackson = "2.15.2"
junit = "5.13.4"
snakeyaml = "2.3"
# Same NBT library the protocol library pulls in.
nbt = "3.0.5.Final"
# The slf4j API the protocol library pulls in is 1.7.
slf4j = "1.7.36"

[libraries]
protocol = { module = "org.cloudburstmc.protocol:bedrock-connection", version.ref = "protocol" }
boar = { module = "ac.boar:common", version.ref = "boar" }
boar-api = { module = "ac.boar:api", version.ref = "boar" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
nbt = { module = "org.cloudburstmc:nbt", version.ref = "nbt" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
aircompressor = { module = "io.airlift:aircompressor", version.ref = "aircompressor" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
