name: Check
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run existing checks and build the distribution
        timeout-minutes: 5
        env:
          JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Xmx1536m
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx1536m -XX:ActiveProcessorCount=2" check :app:installDist
